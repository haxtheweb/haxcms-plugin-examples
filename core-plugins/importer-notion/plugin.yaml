# Notion importer: extracted from core (systemRoutes/v1/routes/imports/convertNotionToSite.js). Reads a Notion export
# that was committed to a GitHub repository: every markdown page, its Notion properties (lesson, id, type) and the
# images and files beside it. Implements import.platform; markdown goes to import.file (import-markdown) and the
# repository is listed and read by import-source, both through the platform, so this plugin reaches no network itself.
specVersion: "0.1.0"
id: importer-notion
uuid: c128819c-70ff-46d1-9d47-be7e99db5462
title: Import from Notion
description: Turns a Notion export kept in a GitHub repository into a new site, grouping pages under their lessons.
version: 0.1.0
category: integration
icon: icons:file-upload
tags: [import, notion, github]
docs: { readme: README.md, agents: AGENTS.md }
core: true
license: Apache-2.0
runtimes: [nodejs, php]
entry:
  nodejs: src/nodejs/index.js
  php: src/php/Plugin.php
implements:
  - { name: import.platform, input: [url] }
# each page's markdown is converted by import.file; the repository is listed and read by import-source.tree
dependencies: [import-markdown, import-source]
staticCapable: false
