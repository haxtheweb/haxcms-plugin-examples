- id: import-html-001
  title: "an HTML file becomes pages without scripts, styles, embeds or handlers"
  given: "a saved web page with two h2 sections and plenty of risky markup"
  when: "imported as a branch"
  then: "Intro and More, clean"
  run:
    steps:
      - importFile: { name: page.html, method: branch, data: "" }
        expect:
          status: 200
          body: { plugin: import-html, title: Old Site Page, items: [{ title: Intro, content: '<p>Hello <a href="#">there</a>.</p>' }, { title: More, content: "<p>Bye</p>" }] }
          notContains: [track, steal, iframe, hidden note, "p{}"]
- id: import-html-002
  title: "the two import contracts side by side"
  given: "import-html (import.file) and importer-html (import.platform)"
  when: "list implementers of each; import a .txt file"
  then: "each contract lists its own plugin with what it accepts; no importer accepts .txt"
  run:
    with: [core-plugins/importer-html]
    steps:
      - implementers: import.file
        expect: { body: [{ id: import-html, accepts: [.html, .htm] }] }
      - implementers: import.platform
        expect: { body: [{ id: importer-html }] }
      - importFile: { name: notes.txt, data: "aGk=" }
        expect: { status: 400, message: "no active import.file implementer accepts .txt" }
