# Common Cartridge importer: turns the course export every LMS writes (.imscc: Canvas, Moodle, D2L Brightspace,
# Blackboard, Sakai) into a new site (https://github.com/haxtheweb/issues/issues/3317). Implements import.platform;
# the cartridge is unpacked by ctx.archive.read, so the plugin ships no zip code and reaches no network.
