openapi: 3.1.0
info: { title: Version control, version: 0.1.0 }
paths:
  /history:
    get:
      operationId: gitHistory
      summary: The site's most recent commits
      security: [{ bearerAuth: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }]
      responses: { "200": { description: OK } }
