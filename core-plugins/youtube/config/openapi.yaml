# Site scope, called by the editor's appstore with the site token (see registries/appstore/youtube.json).
openapi: 3.1.0
info: { title: YouTube, version: 0.1.0 }
paths:
  /search:
    get:
      operationId: youtubeSearch
      summary: Search YouTube videos; the plugin adds the API key server-side
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
        - { name: pageToken, in: query, schema: { type: string, maxLength: 100 } }
      responses: { "200": { description: Google's search response, passed through }, "502": { description: Google could not be reached } }
