# Executable cases for importer-astro (run by harness/run-cases.mjs in Node and PHP, with a parity check).
# Fixtures are synthetic and written inline as base64 zips (built with Python's zipfile, entries sorted by name):
#   trail-docs.zip  a Starlight site as GitHub's "Download ZIP" gives it (everything under trail-docs-main/):
#                   astro.config.mjs (site, base /trail, title, locales root + fr, and a sidebar with a group of two
#                   links, an autogenerated group, an external link and a group holding an unlabelled autogenerated
#                   entry, with a comment); src/content/docs/index.mdx (splash, hero tagline, imports, a JSX comment,
#                   Card and CardGrid, an Image of an imported file); getting-started.md (a :::tip[title] aside);
#                   install.md (a :::caution aside, an image under src/assets, a link with the base);
#                   guides/maps.md and boots.md (sidebar.order 2 and 1), guides/advanced/rope.md, guides/hidden.md
#                   (sidebar.hidden); reference/api.mdx (an Aside, an export, an expression, Tabs, a fenced block);
#                   notes.md (not in the sidebar); fr/index.md; src/assets/trail.jpg and map.png; public/favicon.svg.
#   other.zip       README.md, src/index.md and vite.config.js: not an Astro site.
#   empty.zip       astro.config.mjs, a dynamic route and a component: an Astro site with no pages to import.
- id: importer-astro-001
  title: "a zip of a Starlight site follows its sidebar: groups, autogenerated folders, links, asides and its media"
  given: "trail-docs.zip"
  when: "convert with files: [trail-docs.zip]"
  then: "the title from the config; the home page first with its tagline; the sidebar's groups as pages holding their links in order; an autogenerated folder in sidebar.order then name order, its subfolder as a group, the hidden page out of the menu; the external link as a page holding the link; pages the sidebar does not list at the end, out of the menu; the French page left out and counted; asides and Aside as stop-notes; imported images, assets and public files carried; components, the export and expressions counted; nothing fetched"
  run:
    with: [core-plugins/import-markdown, core-plugins/import-frontmatter, core-plugins/import-source]
    steps:
      - contract: { name: import.platform, op: convert, plugin: importer-astro, input: { files: [{ name: trail-docs.zip, data: "" }] } }
        expect:
          body:
            - plugin: importer-astro
              result:
                title: Trail Docs
                items:
                  - { id: item-1, title: Welcome, slug: welcome, parent: null, order: 0, indent: 0, content: '<p>Everything about the trails.</p><p>Read <a href="start-here/getting-started">getting started</a>.</p><p><media-image source="files/trail.jpg" alt="The trail"></media-image></p>', metadata: { sourceType: astro, astro: { path: src/content/docs/index.mdx, kind: doc } } }
                  - { id: item-2, title: Start here, slug: start-here, parent: null, order: 1, content: "<p></p>", metadata: { astro: { kind: group } } }
                  - { id: item-3, title: Getting Started, slug: start-here/getting-started, parent: item-2, order: 0, indent: 1, content: '<stop-note status="success" title="Before you start"><div slot="message"><p>Bring water.</p></div></stop-note><p>Then <a href="start-here/install">install</a>.</p>' }
                  - { id: item-4, title: Install, slug: start-here/install, parent: item-2, order: 1, content: '<stop-note status="warning" title="Caution"><div slot="message"><p>Check the trail map.</p></div></stop-note><p><media-image source="files/map.png" alt="Map"></media-image></p><p>See the <a href="guides/maps">maps guide</a>.</p>' }
                  - { id: item-5, title: Guides, slug: guides, parent: null, order: 2, content: "<p></p>" }
                  - { id: item-6, title: Boots, slug: guides/boots, parent: item-5, order: 0, content: '<p>Good boots. <media-image source="files/favicon.svg" alt="Icon"></media-image></p>' }
                  - { id: item-7, title: Maps, slug: guides/maps, parent: item-5, order: 1 }
                  - { id: item-8, title: Advanced, slug: guides/advanced, parent: item-5, order: 2, metadata: { astro: { kind: group } } }
                  - { id: item-9, title: Rope work, slug: guides/advanced/rope, parent: item-8, order: 0, indent: 2 }
                  - { id: item-10, title: Old guide, slug: guides/hidden, parent: item-5, order: 3, metadata: { hideInMenu: true } }
                  - { id: item-11, title: Community, slug: community, parent: null, order: 3, content: '<p><a href="https://chat.example.org/">Community</a></p>', metadata: { astro: { kind: link, link: "https://chat.example.org/" } } }
                  - { id: item-12, title: Reference, slug: reference, parent: null, order: 4 }
                  - { id: item-13, title: API, slug: reference/api, parent: item-12, order: 0, content: '<stop-note status="stop" title="Breaking"><div slot="message"><p>Version 2 changed the calls.</p></div></stop-note><p>Current version: .</p><p>npm install trail</p><pre><code class="language-js">const x = { a: 1 };</code></pre>' }
                  - { id: item-14, title: Notes, slug: notes, parent: null, order: 5, content: "<p>Not in the sidebar.</p>", metadata: { hideInMenu: true } }
                files:
                  - { path: files/trail.jpg, data: "/9j/4AAQSkZJRgkIBw==" }
                  - { path: files/map.png, data: "iVBORw0KGgoBAgP/" }
                  - { path: files/favicon.svg, data: "PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciLz4K" }
                stats: { pages: 14, media: 3, languageFiles: 1, starlight: true, unmapped: { "component:Card": 1, "component:CardGrid": 1, "component:TabItem": 1, "component:Tabs": 1, export: 1, expression: 1 } }
          notContains: [item-15, Bienvenue, ":::", "import ", "export ", "slot=\"message\"></p>"]
          fetch: { count: 0 }
- id: importer-astro-002
  title: "an Astro blog in a repository: markdown and .astro pages by folder, a collection under its page, newest first"
  given: "acme/lake-blog: astro.config.mjs (site, no Starlight); src/pages/index.astro (frontmatter script, a Layout component, an h1, a link, a map expression, an img with an expression attribute, a style block), about.md, blog/index.astro, a dynamic blog route and an RSS endpoint; src/content/blog/first-post.md and second-post.mdx (dated, one a draft, an import and a component); src/content/notes/packing.md; public/images/lake.png"
  when: "convert with the repository URL"
  then: "the .astro home page keeps its static markup (no script, style, expressions or component tags) and is titled by its h1; the blog collection sits under the blog page, newest first, the draft unpublished; the notes collection gets a page of its own; the dynamic route and endpoint are not pages; links reach the new slugs; the public image is listed by its raw URL; nine requests, all by import-source to GitHub's two hosts"
  run:
    with: [core-plugins/import-markdown, core-plugins/import-frontmatter, core-plugins/import-source]
    fetch:
      "https://api.github.com/repos/acme/lake-blog": { status: 200, body: { default_branch: main } }
      "https://api.github.com/repos/acme/lake-blog/git/trees/main?recursive=1":
        status: 200
        body: { tree: [{ path: astro.config.mjs, type: blob }, { path: package.json, type: blob }, { path: public/images/lake.png, type: blob }, { path: src/layouts/Layout.astro, type: blob }, { path: src/components/Card.astro, type: blob }, { path: src/pages/index.astro, type: blob }, { path: src/pages/about.md, type: blob }, { path: src/pages/blog/index.astro, type: blob }, { path: "src/pages/blog/[...slug].astro", type: blob }, { path: src/pages/rss.xml.js, type: blob }, { path: src/content/blog/first-post.md, type: blob }, { path: src/content/blog/second-post.mdx, type: blob }, { path: src/content/notes/packing.md, type: blob }] }
      "https://raw.githubusercontent.com/acme/lake-blog/main/astro.config.mjs": { status: 200, body: "import { defineConfig } from 'astro/config';\nimport mdx from '@astrojs/mdx';\nexport default defineConfig({ site: 'https://blog.example.org', integrations: [mdx()] });\n" }
      "https://raw.githubusercontent.com/acme/lake-blog/main/src/pages/index.astro": { status: 200, body: "---\nimport Layout from '../layouts/Layout.astro';\nconst posts = await getCollection('blog');\n---\n<Layout title=\"Home\">\n  <main>\n    <h1>Lake Blog</h1>\n    <p>Notes from the water. See <a href=\"/about/\">about</a>.</p>\n    <ul>{posts.map((p) => <li>{p.data.title}</li>)}</ul>\n    <img src=\"/images/lake.png\" alt=\"Lake\" class={cls} />\n  </main>\n</Layout>\n<style>h1 { color: red; }</style>\n" }
      "https://raw.githubusercontent.com/acme/lake-blog/main/src/pages/about.md": { status: 200, body: "---\ntitle: About\nlayout: ../layouts/Page.astro\n---\nWe walk. Read the [first post](/blog/first-post/).\n" }
      "https://raw.githubusercontent.com/acme/lake-blog/main/src/pages/blog/index.astro": { status: 200, body: "---\nconst x = 1;\n---\n<Layout title=\"Blog\"><h1>All posts</h1><p>Newest first.</p></Layout>\n" }
      "https://raw.githubusercontent.com/acme/lake-blog/main/src/content/blog/first-post.md": { status: 200, body: "---\ntitle: First Post\npubDate: 2026-01-10\ntags: [walks]\n---\nShort walk. Back [home](/).\n" }
      "https://raw.githubusercontent.com/acme/lake-blog/main/src/content/blog/second-post.mdx": { status: 200, body: "---\ntitle: Second Post\npubDate: 2026-02-01T09:00:00Z\ndraft: true\n---\nimport Chart from '../../components/Chart.astro';\n\nLonger walk.\n\n<Chart data={[1, 2]} />\n" }
      "https://raw.githubusercontent.com/acme/lake-blog/main/src/content/notes/packing.md": { status: 200, body: "---\ntitle: Packing\n---\nPack light.\n" }
      blog.example.org: { status: 200, body: "should not be read" }
    steps:
      - contract: { name: import.platform, op: convert, plugin: importer-astro, input: { url: "https://github.com/acme/lake-blog" } }
        expect:
          body:
            - result:
                title: lake-blog
                items:
                  - { id: item-1, title: Lake Blog, slug: lake-blog, parent: null, order: 0, content: "<h1>Lake Blog</h1>\n    <p>Notes from the water. See <a href=\"about\">about</a>.</p>\n    <ul></ul>\n    <media-image source=\"files/lake.png\" alt=\"Lake\"></media-image>", metadata: { sourceType: astro, astro: { path: src/pages/index.astro, kind: page } } }
                  - { id: item-2, title: About, slug: about, parent: null, order: 1, content: '<p>We walk. Read the <a href="blog/first-post">first post</a>.</p>' }
                  - { id: item-3, title: All posts, slug: blog, parent: null, order: 2, content: "<h1>All posts</h1><p>Newest first.</p>" }
                  - { id: item-4, title: Second Post, slug: blog/second-post, parent: item-3, order: 0, indent: 1, content: "<p>Longer walk.</p>", metadata: { astro: { kind: entry }, published: false, created: 1769936400 } }
                  - { id: item-5, title: First Post, slug: blog/first-post, parent: item-3, order: 1, content: '<p>Short walk. Back <a href="lake-blog">home</a>.</p>', metadata: { created: 1768003200, tags: [walks] } }
                  - { id: item-6, title: Notes, slug: notes, parent: null, order: 3, content: "<p></p>", metadata: { astro: { kind: collection } } }
                  - { id: item-7, title: Packing, slug: notes/packing, parent: item-6, order: 0, content: "<p>Pack light.</p>" }
                files:
                  - { path: files/lake.png, url: "https://raw.githubusercontent.com/acme/lake-blog/main/public/images/lake.png" }
                stats: { pages: 7, media: 1, languageFiles: 0, starlight: false, unmapped: { "component:Chart": 1, "component:Layout": 2, expression: 2, "route:dynamic": 1 } }
          notContains: [item-8, "color: red", "getCollection", "<style", "<Layout"]
          fetch: { count: 9, notContains: [blog.example.org] }
- id: importer-astro-003
  title: "what is not an Astro site, a zip or a GitHub repository is an error"
  given: "other.zip (no astro.config); empty.zip (only a dynamic route and a component); an upload that is not named .zip; one that is not a zip; a URL on another host; no input"
  when: "convert"
  then: "error results naming the problem; nothing is fetched"
  run:
    with: [core-plugins/import-markdown, core-plugins/import-frontmatter, core-plugins/import-source]
    fetch:
      astro.example.org: { status: 200, body: "should not be read" }
    steps:
      - contract: { name: import.platform, op: convert, plugin: importer-astro, input: { files: [{ name: other.zip, data: "" }] } }
        expect: { body: [{ result: { error: "no Astro site found in other (expected an astro.config.mjs, .js or .ts)" } }], fetch: { count: 0 } }
      - contract: { name: import.platform, op: convert, plugin: importer-astro, input: { files: [{ name: empty.zip, data: "" }] } }
        expect: { body: [{ result: { error: "no pages found in empty" } }] }
      - contract: { name: import.platform, op: convert, plugin: importer-astro, input: { files: [{ name: site.tar.gz, data: "bm90IGEgemlw" }] } }
        expect: { body: [{ result: { error: "expected a .zip of the Astro site" } }] }
      - contract: { name: import.platform, op: convert, plugin: importer-astro, input: { files: [{ name: site.zip, data: "bm90IGEgemlw" }] } }
        expect: { body: [{ result: { error: "the file is not a zip archive" } }] }
      - contract: { name: import.platform, op: convert, plugin: importer-astro, input: { url: "https://astro.example.org/docs/" } }
        expect: { body: [{ result: { error: "url must be a GitHub repository (https://github.com/<owner>/<repo>)" } }], fetch: { count: 0 } }
      - contract: { name: import.platform, op: convert, plugin: importer-astro, input: {} }
        expect: { body: [{ result: { error: "url or files is required" } }] }
