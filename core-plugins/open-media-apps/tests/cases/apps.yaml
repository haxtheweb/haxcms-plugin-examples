- id: open-media-apps-001
  title: "enabled: all five apps are in the editor; disabled: none are"
  given: "the pack enabled"
  when: "rebuild, disable, rebuild"
  then: "five apps, then none"
  run:
    steps:
      - rebuild: {}
        expect: { body: { apps: ["CC Mixter", Dailymotion, NASA, Sketchfab, Wikipedia] } }
      - disable: open-media-apps
        expect: { status: 200 }
      - rebuild: {}
        expect: { body: { apps: [] } }
