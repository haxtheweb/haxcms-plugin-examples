# MCP: core, optional, opt-in like every non-required plugin; HAXiam blocks it for now (deployment config `blocked`).
# haxcms-mcp (https://github.com/haxtheweb/haxcms-mcp) is a separate MCP server that drives HAXcms over HTTP. This
# plugin is what HAXcms knows about it:
#  - it replaces core's config.mcp: the plugin being enabled is mcp.enabled, its readOnly setting is mcp.readOnly,
#    and core keeps publishing both as data.mcp on GET /system/api/v1, which haxcms-mcp already obeys;
#  - it is an oauth.resource: the oauth plugin issues tokens for the haxcms-mcp URL (the audience), and this plugin
#    decides what such a token may call;
#  - it lists the plugin operations marked x-hax-mcp and every plugin's prompts for the server (mcpDiscovery).
specVersion: "0.1.0"
id: mcp
uuid: 3e5a7c9e-1b3d-4e5a-7c9e-1b3d5f7a9c1e
title: MCP access
description: Lets AI agents you approve use this HAXcms through MCP, read-only unless you allow changes.
version: 0.1.0
category: integration
icon: icons:settings-ethernet
tags: [agents, mcp]
docs: { readme: README.md, agents: AGENTS.md }
core: true
license: Apache-2.0
runtimes: [nodejs, php]
entry:
  nodejs: src/nodejs/index.js
  php: src/php/Plugin.php
openapi: config/openapi.yaml
settings: config/settings.schema.json
dependencies: [oauth]             # tokens, consent, revocation: MCP leverages OAuth rather than issuing its own
implements: [oauth.resource]
staticCapable: false
# Its own code touches no content, so it requests no capabilities. What it lets approved agents do (act as the person
# who approved them, read-only unless allowed) is a delegation the manifest cannot declare yet: spec/GAPS.md 1s.
capabilities: []
legacy:
  settings:
    readOnly: config:mcp.readOnly   # core's instance-wide switch moves here on the first enable
