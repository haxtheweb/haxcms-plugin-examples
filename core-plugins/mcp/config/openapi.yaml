openapi: 3.1.0
info: { title: MCP access, version: 0.1.0 }
x-hax-scope: system
paths:
  /discovery:
    get:
      operationId: mcpDiscovery
      summary: What this token may use - operations marked x-hax-mcp and prompts - for the MCP server
      x-hax-public: true             # the OAuth token is checked by the oauth plugin, which passes the grant on
      x-hax-rate-limit: { requests: 60, per: minute }
      responses: { "200": { description: OK }, "401": { description: No valid MCP token } }
