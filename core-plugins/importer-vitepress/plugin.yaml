# VitePress importer: extracted from core (systemRoutes/v1/routes/imports/convertVitepressToSite.js). Reads a VitePress
# site from a GitHub repository (or an uploaded zip of one): the sidebar out of .vitepress/config.* as data (never
# executed), every page, and the repository images and files those pages use. Implements import.platform; markdown goes
# to import.file (import-markdown) through the platform. It may reach only GitHub's API and raw-file hosts.
specVersion: "0.1.0"
id: importer-vitepress
uuid: 0f7fe6dd-cdbc-4ed8-96e4-45c4f20d9b6d
title: Import from VitePress
description: Turns a VitePress site (a GitHub repository or a zip of one) into a new site, following its sidebar.
version: 0.1.0
category: integration
icon: icons:file-upload
tags: [import, vitepress, github]
docs: { readme: README.md, agents: AGENTS.md }
core: true
license: Apache-2.0
runtimes: [nodejs, php]
entry:
  nodejs: src/nodejs/index.js
  php: src/php/Plugin.php
implements: [import.platform]
dependencies: [import-markdown]   # each page's markdown is converted by import.file
capabilities: ["network:egress"]
# The person gives a github.com repository URL; the file tree comes from GitHub's API and the files from its raw host.
egress:
  - api.github.com
  - raw.githubusercontent.com
staticCapable: false
