# Quarto importer: extracted from core (systemRoutes/v1/routes/imports/convertQuartoToSite.js). Reads a Quarto book or
# website from a GitHub repository (or an uploaded zip of one): the _quarto.yml outline, every page, and the repository
# images and files those pages use. Implements import.platform; markdown goes to import.file (import-markdown) through
# the platform. It may reach only GitHub's API and raw-file hosts.
specVersion: "0.1.0"
id: importer-quarto
uuid: 54bbcdad-bd3c-4300-a63c-26708fe1be34
title: Import from Quarto
description: Turns a Quarto book or website (a GitHub repository or a zip of one) into a new site, following its outline.
version: 0.1.0
category: integration
icon: icons:file-upload
tags: [import, quarto, github]
docs: { readme: README.md, agents: AGENTS.md }
core: true
license: Apache-2.0
runtimes: [nodejs, php]
entry:
  nodejs: src/nodejs/index.js
  php: src/php/Plugin.php
implements: [import.platform]
dependencies: [import-markdown]   # each page's markdown is converted by import.file
capabilities: ["network:egress"]
# The person gives a github.com repository URL; the file tree comes from GitHub's API and the files from its raw host.
egress:
  - api.github.com
  - raw.githubusercontent.com
staticCapable: false
