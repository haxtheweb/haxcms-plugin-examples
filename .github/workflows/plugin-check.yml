name: plugin-check
# hax-plugin-check (harness/check) on every plugin in this repository: the same
# kinds of checks haxcms-nodejs, haxcms-php and webcomponents run, on whichever
# parts each plugin has. Blocking. Layers:
#   manifest  is it a valid plugin (scripts/validate.mjs, the CLI's validator)
#   cases     executable cases in Node and PHP, with parity
#   node      ESLint (haxcms-nodejs rules), node --test, parity runners
#   php       php -l + PHPStan level 5 (new errors block; harness/check/phpstan-baseline.neon)
#             + the plugin's PHPUnit tests (tests/php, PluginTestCase in harness/php)
#   frontend  ESLint (webcomponents rules) + Chrome: load, axe AA light/dark,
#             dark mode, reduced motion
#   live      a real haxcms-nodejs server with the plugin installed: plugin
#             list, contributions, its GET routes, a real page save
#
# The live job runs against haxcms-nodejs's plugin platform branch
# (HAXCMS_NODEJS_REF; today draft/plugin-platform, haxcms-nodejs#138), with
# this checkout installed as its @haxtheweb/haxcms-plugin-spec, so a change
# here is tested in the server that will run it. haxcms-php's native engine
# (haxcms-php#822) runs every conformance case and plugin case in the last job;
# it has no boot-and-call-over-HTTP job yet, so PHP plugin code is also covered
# by the php job (cases, parity, PHPStan, PHPUnit on PHP 8.3 to 8.6).
on:
  push:
    branches: [main]
  # No branch filter: stacked PRs (base is another feature branch) must run too.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugin-check-${{ github.ref }}
  cancel-in-progress: true
env:
  HAXCMS_NODEJS_REF: draft/plugin-platform
  # haxcms-php with the native plugin engine (its draft PR for haxtheweb/issues#3356)
  HAXCMS_PHP_REF: draft/plugin-platform
jobs:
  check:
    name: "hax-plugin-check (manifest, cases, node, php, frontend)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          coverage: none
          tools: phpunit:11.5
      - name: Cache PHPStan phar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/haxcms-phpstan
          key: phpstan-${{ hashFiles('harness/check/phpstan.sh') }}
      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Self-test (every gate catches its broken fixture)
        run: node harness/check/self-test.mjs
      - name: Check every plugin
        run: node harness/check/run.mjs

  php:
    # The PHP side of every plugin on the other PHP versions haxcms-php supports: the executable cases in the
    # PHP runtime with Node/PHP parity, php -l, PHPStan and the plugins' PHPUnit tests. 8.3 runs in the check
    # job above. 8.6 reaches GA on 2026-11-19; until then it shows failures without failing the check (same
    # rule as haxcms-php).
    name: "hax-plugin-check PHP ${{ matrix.php-version }} (cases, php)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5", "8.6"]
    continue-on-error: ${{ matrix.php-version == '8.6' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: phpunit:11.5
      - name: Cache PHPStan phar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/haxcms-phpstan
          key: phpstan-${{ hashFiles('harness/check/phpstan.sh') }}
      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the PHP side of every plugin
        run: node harness/check/run.mjs --only cases,php
      - name: Conformance cases with the fixtures' PHP code (reference engine, PHP bridge)
        run: node conformance/run.mjs --runtime php

  live:
    name: "hax-plugin-check live (real haxcms-nodejs)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: spec
      - name: Checkout haxcms-nodejs (plugin platform)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haxtheweb/haxcms-nodejs
          ref: ${{ env.HAXCMS_NODEJS_REF }}
          path: haxcms-nodejs
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install this checkout
        working-directory: spec
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install haxcms-nodejs, with this checkout as its plugin spec
        working-directory: haxcms-nodejs
        run: |
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          rm -rf node_modules/@haxtheweb/haxcms-plugin-spec
          ln -s "$GITHUB_WORKSPACE/spec" node_modules/@haxtheweb/haxcms-plugin-spec
      - name: Live check every plugin
        working-directory: spec
        run: node harness/check/run.mjs --only live --haxcms ../haxcms-nodejs

  live-php:
    # haxcms-php's native PHP engine (haxtheweb/issues#3356): every conformance case and every plugin's PHP cases on a
    # real HAXcms site, then each plugin's cases compared step by step with the reference engine running the same
    # PHP code. A difference is a bug in one engine or a gap in this spec.
    name: "haxcms-php native engine (conformance, cases, parity)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: spec
      - name: Checkout haxcms-php (plugin platform)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haxtheweb/haxcms-php
          ref: ${{ env.HAXCMS_PHP_REF }}
          path: haxcms-php
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, dom, zip, curl, zlib
          coverage: none
      - name: Install this checkout
        working-directory: spec
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Conformance, every plugin's PHP cases, and parity with the reference engine
        working-directory: haxcms-php
        env:
          HAXCMS_PLUGIN_SPEC_DIR: ${{ github.workspace }}/spec
        run: node test/plugins/run-all.mjs
