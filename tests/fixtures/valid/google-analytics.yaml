specVersion: "0.1.0"
id: google-analytics
uuid: f4febbcd-fc83-40f0-8090-903966f5d23f
title: Google Analytics
description: Adds Google Analytics after visitor consent.
version: 0.1.0
runtimes: [nodejs, php]
entry: { nodejs: src/nodejs/index.js, php: src/php/Plugin.php }
dependencies: [cookie-consent@>=0.1.0]
implements: [consent.subject]
settings: config/settings.schema.json
hooks:
  - { name: render.before.head, priority: 10 }
privacy:
  tracking: true
  categories: [analytics]
  cookies: [_ga]
  recipients: [www.google-analytics.com]
  requiresConsent: [analytics]
egress: [www.google-analytics.com]
capabilities: [output:inject, network:egress]
