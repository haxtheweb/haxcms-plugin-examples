option:
  title: Tip of the day
  icon: icons:lightbulb-outline
  tags: [tips, announcements]
  path: HAX/action/tips
  context: [HAX]
  voice: tip of the day
  eventName: super-daemon-run-program
  value:
    name: Tip of the day
    machineName: announcements-tip
program:
  kind: api
  operation: announcementsListAll
  query: { q: "{{input}}", "filter[kind]": tip, "page.limit": 10 }
  items: items
  row:
    title: "{{label}}"
    description: "{{description}}"
    icon: "{{type.icon}}"
    tags: ["{{type.key}}"]
    path: "HAX/action/tips/{{slug}}"
    eventName: super-daemon-noop
    value: {}
