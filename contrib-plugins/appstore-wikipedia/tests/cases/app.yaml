- id: appstore-wikipedia-001
  title: "enabled: the app is in the editor; disabled: it is not"
  given: "the pack enabled"
  when: "rebuild, disable, rebuild"
  then: "Wikipedia listed, then not"
  run:
    steps:
      - rebuild: {}
        expect: { body: { apps: ["Wikipedia"] } }
      - disable: appstore-wikipedia
        expect: { status: 200 }
      - rebuild: {}
        expect: { body: { apps: [] } }
