- id: reading-time-002
  title: "the page shows the label"
  hook: render.before.content
  given: "a page whose metadata says 3 minutes; label 'About {n} minutes'"
  when: "rendered"
  then: "the label is at the top of the content"
  run:
    settings: { label: "About {n} minutes" }
    steps:
      - render: { page: { id: p1, content: "<p>x</p>", metadata: { plugins: { reading-time: { words: 600, minutes: 3 } } } } }
        expect: { contains: ['<main><p class="reading-time">About 3 minutes</p><p>x</p>'] }
