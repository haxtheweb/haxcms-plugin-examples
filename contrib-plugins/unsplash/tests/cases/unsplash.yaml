- id: unsplash-001
  title: "inactive without a key, so the app is not in the editor"
  given: "no key"
  when: "rebuild"
  then: "Unsplash is not among the appstore apps; the search route is not served"
  run:
    steps:
      - rebuild: {}
        expect: { status_of: { unsplash: inactive }, notContains: ['"Unsplash"'] }
      - call: { operation: unsplashSearch, query: { query: x } }
        expect: { status: 404 }
- id: unsplash-002
  title: "the proxy adds the key server-side and passes only listed parameters"
  given: "a key; api.unsplash.com answers"
  when: "the editor searches"
  then: "the outgoing request carries the key and the search; an unlisted parameter is dropped; the key never reaches the response"
  run:
    settings: { apiKey: test-key-unsplash }
    fetch: { api.unsplash.com: { status: 200, body: {"results": [{"id": "u1", "description": "lake", "urls": {"thumb": "t", "regular": "r"}, "user": {"name": "B"}}], "total": 1, "total_pages": 1} } }
    steps:
      - rebuild: {}
        expect: { body: { apps: ["Unsplash"] } }
      - call: { operation: unsplashSearch, query: { query: cats, sneaky: "1" } }
        expect:
          status: 200
          fetch: { count: 1, contains: ["https://api.unsplash.com/search/photos", "client_id=test-key-unsplash", "query=cats"], notContains: [sneaky] }
          notContains: [test-key-unsplash]
- id: unsplash-003
  title: "first enable moves the key out of the core config"
  given: "appStore.apiKeys.unsplash in the core config"
  when: "enable unsplash"
  then: "the plugin is active with the key; the core config no longer has it"
  run:
    records: { config: [{ id: core, appStore: { apiKeys: { unsplash: old-test-key-unsplash, other: keep } } }] }
    steps:
      - enable: unsplash
        expect: { status: 200, status_of: { unsplash: active } }
      - record: { type: config, id: core }
        expect: { subject: { appStore: { apiKeys: { other: keep } } }, notContains: [old-test-key-unsplash] }
- id: unsplash-004
  title: "api.unsplash.com down is a 502, not a crash"
  given: "a key, no answer from api.unsplash.com"
  when: "search"
  then: "502 with a log warning"
  run:
    settings: { apiKey: test-key-unsplash }
    steps:
      - call: { operation: unsplashSearch, query: { query: x } }
        expect: { status: 502, notContains: [test-key-unsplash], log: { contains: ["network is disabled in the harness"] } }
