- id: appstore-sketchfab-001
  title: "enabled: the app is in the editor; disabled: it is not"
  given: "the pack enabled"
  when: "rebuild, disable, rebuild"
  then: "Sketchfab listed, then not"
  run:
    steps:
      - rebuild: {}
        expect: { body: { apps: ["Sketchfab"] } }
      - disable: appstore-sketchfab
        expect: { status: 200 }
      - rebuild: {}
        expect: { body: { apps: [] } }
