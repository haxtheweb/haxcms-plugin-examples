openapi: 3.1.0
info: { title: xAPI statements, version: 0.1.0 }
paths:
  /statements:
    post:
      operationId: xapiStatementsRecord
      summary: Record a statement for the signed-in user (verb and object; the actor is always the caller)
      security: [{ bearerAuth: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [verb, object], properties: { verb: { type: string }, object: { type: string }, result: { type: object } } } } } }
      responses: { "200": { description: Queued }, "422": { description: Invalid } }
