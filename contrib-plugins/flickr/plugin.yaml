# Community plugin (moved out of core: nice to have, off by default; pasting a video or image URL still works without it).
# Flickr: an appstore provider extracted from core (HAXAppStoreService.loadBaseAppStore() adds it when
# appStore.apiKeys.flickr is set, and sends the key to the browser inside the payload). Declarative: there is no plugin code.
# Its one operation is an x-hax-proxy that core answers on either backend, adding the secret key server-side.
specVersion: "0.1.0"
id: flickr
uuid: a4ef55b9-24bb-5ed1-9a69-a676faf38354
title: Flickr
description: Search Flickr from the editor and insert photos, filtered by license. The API key stays on the server.
version: 0.1.0
category: media
icon: image:collections
tags: [images, appstore]
docs: { readme: README.md, agents: AGENTS.md }
license: Apache-2.0
openapi: config/openapi.yaml       # no entry, no runtimes: every operation is an x-hax-proxy
settings: config/settings.schema.json
staticCapable: false               # searching needs the server; inserted media works anywhere
capabilities: ["network:egress", "settings:secret"]
egress: [api.flickr.com]
legacy:
  settings:
    apiKey: config:appStore.apiKeys.flickr   # core moves it here on first enable
