- id: appstore-nasa-001
  title: "enabled: the app is in the editor; disabled: it is not"
  given: "the pack enabled"
  when: "rebuild, disable, rebuild"
  then: "NASA listed, then not"
  run:
    steps:
      - rebuild: {}
        expect: { body: { apps: ["NASA"] } }
      - disable: appstore-nasa
        expect: { status: 200 }
      - rebuild: {}
        expect: { body: { apps: [] } }
