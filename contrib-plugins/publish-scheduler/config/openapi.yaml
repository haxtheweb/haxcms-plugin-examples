openapi: 3.1.0
info: { title: Publish scheduler, version: 0.1.0 }
paths:
  /pages/{pageId}:
    put:
      operationId: publishSchedulerSet
      summary: Set or clear when a page is published or unpublished
      security: [{ bearerAuth: [] }]
      parameters: [{ name: pageId, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { publishAt: { type: [string, "null"], format: date-time }, unpublishAt: { type: [string, "null"], format: date-time } } } } } }
      responses: { "200": { description: OK }, "404": { description: No such page }, "422": { description: Not a date } }
  /due:
    get:
      operationId: publishSchedulerDue
      summary: Pages waiting to be published or unpublished
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: OK } }
