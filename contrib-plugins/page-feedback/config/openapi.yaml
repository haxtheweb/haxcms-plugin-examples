openapi: 3.1.0
info: { title: Page feedback, version: 0.1.0 }
paths:
  /feedback:
    post:
      operationId: pageFeedbackSubmit
      summary: Send feedback on a page. Open to visitors; nothing about the sender is accepted from the request.
      x-hax-public: true
      x-hax-rate-limit: { requests: 10, per: minute }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pageId, helpful]
              properties:
                pageId: { type: string, minLength: 1, maxLength: 200 }
                helpful: { type: boolean }
                reasons: { type: array, maxItems: 12, uniqueItems: true, items: { type: string, maxLength: 40 } }
                comment: { type: string, maxLength: 20000 }
      responses:
        "200": { description: Received, content: { application/json: { schema: { type: object, required: [received], properties: { received: { type: boolean } } } } } }
        "403": { description: Sent from another site, or refused by another plugin }
        "404": { description: No such page }
        "422": { description: The rating, a reason or the comment is not acceptable }
        "429": { description: Too many responses this hour }
    get:
      operationId: pageFeedbackList
      summary: Feedback for site editors, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: "filter[pageId]", in: query, schema: { type: string, maxLength: 200 } }
        - { name: "filter[helpful]", in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: "filter[handled]", in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: "filter[hasComment]", in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: "filter[from]", in: query, description: "First day, YYYY-MM-DD (UTC)", schema: { type: string, maxLength: 10 } }
        - { name: "filter[to]", in: query, description: "Last day, YYYY-MM-DD (UTC)", schema: { type: string, maxLength: 10 } }
        - { name: "page[limit]", in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 25 } }
        - { name: "page[offset]", in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: "{ items, total, limit, offset }" }
        "403": { description: Not a site editor }
        "422": { description: A filter is not acceptable }
  /feedback/{id}:
    put:
      operationId: pageFeedbackHandle
      summary: Mark one response handled, or not handled again
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, maxLength: 20 } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [handled], properties: { handled: { type: boolean } } } } } }
      responses: { "200": { description: OK }, "403": { description: Not a site editor }, "404": { description: Not found }, "422": { description: handled must be true or false } }
    delete:
      operationId: pageFeedbackDelete
      summary: Delete one response
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, maxLength: 20 } }]
      responses: { "200": { description: OK }, "403": { description: Not a site editor }, "404": { description: Not found } }
  /summary:
    get:
      operationId: pageFeedbackSummary
      summary: Per page, the share of helpful answers, the number of responses and the most picked reason
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: "{ items, totals }" }, "403": { description: Not a site editor } }
