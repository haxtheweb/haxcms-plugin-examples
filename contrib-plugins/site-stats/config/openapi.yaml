openapi: 3.1.0
info: { title: Site stats, version: 0.1.0 }
paths:
  /report:
    get:
      operationId: siteStatsReport
      summary: Pages, words and blocks used, for the whole site or public pages only
      security: [{ bearerAuth: [] }]
      x-hax-mcp: true
      parameters: [{ name: public, in: query, schema: { type: string } }, { name: top, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }]
      responses: { "200": { description: OK } }
