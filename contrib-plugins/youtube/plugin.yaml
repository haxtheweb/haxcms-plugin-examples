# Community plugin (moved out of core: nice to have, off by default; pasting a video or image URL still works without it).
# YouTube: an appstore provider extracted from core. Today HAXAppStoreService.loadBaseAppStore() adds a YouTube app to
# the editor's appstore payload when an API key is configured (appStore.apiKeys.youtube in the core config,
# settings/apiKeys.json), and the key itself travels to the browser inside the payload (connection.data.key).
# As a plugin the key is a secret setting that never leaves the server: the appstore app points at this plugin's own
# search route, an x-hax-proxy that adds the key when core calls Google. There is no plugin code.
specVersion: "0.1.0"
id: youtube
uuid: 3f5b7d9e-1c2a-4e6b-8d0f-2a4c6e8b0d1f
title: YouTube
description: Search YouTube from the editor and insert videos. The API key stays on the server.
version: 0.1.0
category: media
icon: mdi-action:youtube-play
tags: [video, appstore]
docs: { readme: README.md, agents: AGENTS.md }
license: Apache-2.0
openapi: config/openapi.yaml            # no entry: the search route is an x-hax-proxy core answers on either backend
settings: config/settings.schema.json   # system scope (default): one key for the deployment
staticCapable: false                    # searching needs the server; inserted videos work anywhere
capabilities: ["network:egress", "settings:secret"]   # core moves the key out of the core config (legacy.settings)
egress: [www.googleapis.com]
legacy:
  settings:
    apiKey: config:appStore.apiKeys.youtube
