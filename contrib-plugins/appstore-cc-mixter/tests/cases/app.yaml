- id: appstore-cc-mixter-001
  title: "enabled: the app is in the editor; disabled: it is not"
  given: "the pack enabled"
  when: "rebuild, disable, rebuild"
  then: "CC Mixter listed, then not"
  run:
    steps:
      - rebuild: {}
        expect: { body: { apps: ["CC Mixter"] } }
      - disable: appstore-cc-mixter
        expect: { status: 200 }
      - rebuild: {}
        expect: { body: { apps: [] } }
