openapi: 3.1.0
info: { title: Media library, version: 0.1.0 }
paths:
  /items:
    get:
      operationId: mediaLibraryList
      summary: Library records; ?missingAlt=1 lists images that still need alt text
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: OK } }
  /items/{uuid}:
    put:
      operationId: mediaLibraryDescribe
      summary: Set alt text, credit and license
      security: [{ bearerAuth: [] }]
      parameters: [{ name: uuid, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Missing alt text } }
