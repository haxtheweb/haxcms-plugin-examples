- id: load-001
  title: "a plugin with an unknown manifest key is rejected and disabled with a reason"
  spec: spec/02-anatomy-and-manifest.md
  given: "plugins: [{id: bad, manifest: {surprise: true}}]"
  when: "load"
  then: "bad: disabled, reason mentions the key; boot continues"
- id: load-002
  title: "an invalid plugin never stops boot"
  spec: spec/03-tiers-and-enablement.md
  given: "plugins: [broken, good]"
  when: "boot"
  then: "good enabled; broken disabled with reason"
- id: load-003
  title: "a plugin whose specVersion is newer than the loader is refused"
  spec: spec/02-anatomy-and-manifest.md
  given: "plugin specVersion: 99.0.0"
  when: "load"
  then: "refused with a version message"
- id: load-004
  title: "pack plugins never run backend code at any tier"
  spec: spec/02-anatomy-and-manifest.md
  given: "kind: pack at tier site with backend flag off"
  when: "load"
  then: "enabled; no backend entry executed"
- id: load-099
  title: "a failure while enabling turns the plugin off with a reason"
  spec: spec/03-tiers-and-enablement.md
  given: "plugin whose install hook throws"
  when: "enable"
  then: "plugin disabled with the error recorded; other plugins unaffected"
- id: load-100
  title: "a parent plugin cannot be disabled while a dependent is enabled"
  spec: spec/03-tiers-and-enablement.md
  given: "A requires B, both enabled"
  when: "disable B"
  then: "409 listing A; disabling A first then B succeeds"
- id: load-101
  title: "a plugin with unmet requirements is enabled but inactive"
  spec: spec/06-hooks-and-contracts.md
  given: "plugin.requirements returns [{key: settings.greeting}]"
  when: "enable"
  then: "status enabled/inactive with the message; no hooks, routes or registries run; setting the value makes it active"
- id: load-102
  title: "a system-enabled plugin cannot be disabled for one site"
  spec: spec/03-tiers-and-enablement.md
  given: "plugin enabled at system level"
  when: "disable --site mysite"
  then: "refused with a message naming the system scope"
- id: load-103
  title: "enabling a declared conflict warns but succeeds"
  spec: spec/03-tiers-and-enablement.md
  given: "A conflicts: [B]; B enabled"
  when: "enable A"
  then: "A enabled; warning on dashboard, CLI and log"
- id: load-104
  title: "hooks run by priority then cascade"
  spec: spec/06-hooks-and-contracts.md
  given: "two plugins on render.after, priority 10 and 0"
  when: "render"
  then: "priority 10 runs first; equal priorities follow the cascade"
- id: load-105
  title: "a site copy of a plugin overrides the system copy with a warning"
  spec: spec/03-tiers-and-enablement.md
  given: "plugin x 1.0.0 at system, 1.1.0 at site"
  when: "load for the site"
  then: "1.1.0 used; warning names both versions"
- id: load-106
  title: "uninstall is refused while enabled and purges data when run"
  spec: spec/09-packaging-tooling.md
  given: "plugin enabled on one site with stored data"
  when: "uninstall; then disable and uninstall"
  then: "first refused; second runs uninstall hooks and removes the data and files"
- id: load-107
  title: "setting a required value activates the plugin"
  spec: spec/06-hooks-and-contracts.md
  given: "plugin enabled/inactive waiting on settings.greeting"
  when: "config set greeting hello"
  then: "config.before.save and config.after.save fire; requirements re-run; status active"
- id: load-108
  title: "importing a site with a missing plugin warns in that site's log"
  spec: spec/03-tiers-and-enablement.md
  given: "site.json lists plugin x 1.2.0; deployment lacks x"
  when: "site added to the deployment"
  then: "site works; warning in its log naming x and the version"
