- id: hooks-001
  title: "before hooks may veto with a message"
  spec: spec/06-hooks-and-contracts.md
  given: "example vetoes boring.awesome"
  when: "create awesomeFile named boring.awesome"
  then: "rejected with the message"
- id: hooks-002
  title: "a hook returning an invalid entity is discarded and the chain continues"
  spec: spec/06-hooks-and-contracts.md
  given: "hook returns entity missing required field"
  when: "create"
  then: "previous data used; error logged"
- id: hooks-003
  title: "after hooks cannot veto"
  spec: spec/06-hooks-and-contracts.md
  given: "after hook returns veto"
  when: "create"
  then: "operation succeeds; veto ignored and logged"
- id: hooks-004
  title: "a throwing hook does not crash the operation"
  spec: spec/06-hooks-and-contracts.md
  given: "hook throws"
  when: "any operation"
  then: "operation completes; error logged"
- id: hooks-005
  title: "chain order: required first, then tier low to high, then priority, then alphabetical"
  spec: spec/06-hooks-and-contracts.md
  given: "three plugins with mixed tiers and priorities"
  when: "invoke hook"
  then: "documented order"
- id: hooks-006
  title: "a hung hook is stopped by the per-hook timeout"
  spec: spec/06-hooks-and-contracts.md
  given: "hook never resolves"
  when: "invoke"
  then: "operation continues after timeout"
- id: hooks-007
  title: "every hook in schema/hooks.json is implemented by examples/example"
  spec: spec/10-examples-conformance.md
  given: "examples/example"
  when: "static check"
  then: "all present in manifest, nodejs and php"
- id: hooks-008
  title: "install fires only the first time a plugin is enabled in a scope; enable fires every time"
  spec: spec/06-hooks-and-contracts.md
  given: "plugin with install and enable hooks, enabled for site A"
  when: "disable then enable again on site A, then enable on site B"
  then: "install ran once for A and once for B; enable ran on all three enables"
- id: hooks-009
  title: "a setting migrated by the install hook leaves the global form and is read from plugin config"
  spec: spec/07-registries-settings-assets.md
  given: "site.json has metadata.site.settings.gaID; google-analytics not yet enabled"
  when: "enable google-analytics for the site"
  then: "value present in the plugin's settings; global form no longer shows the field"
- id: hooks-010
  title: "hook context subject is the entity, page or manifest, plugin, site or user the hook is about"
  spec: spec/06-hooks-and-contracts.md
  given: "hooks subscribed to entity.before.update, plugin.after.enable and site.after.create"
  when: "each fires"
  then: "ctx.subject is the entity being saved, the plugin object and the site respectively"
- id: hooks-011
  title: "the subject is passed by reference: a before hook's change is written, an after hook's change reaches the caller but not the stored record"
  spec: spec/06-hooks-and-contracts.md
  given: "hooks that set a field on the subject, subscribed before and after update"
  when: "update an entity"
  then: "stored record has the before-hook change only; the returned entity has both"
- id: hooks-012
  title: "ctx.previous carries the prior version on update"
  spec: spec/06-hooks-and-contracts.md
  given: "an after-update hook"
  when: "update an entity"
  then: "ctx.previous is the version before the update"
- id: hooks-013
  title: "git.after.commit fires after every commit made following an item or manifest save"
  spec: spec/06-hooks-and-contracts.md
  given: "a git.after.commit hook that records the commit"
  when: "save a page, then save the manifest"
  then: "two commits recorded, each after its save completed"
- id: hooks-014
  title: "page and manifest saves run their own hooks as well as entity hooks"
  spec: spec/06-hooks-and-contracts.md
  given: "hooks on page.before.save and entity.before.update"
  when: "save a page"
  then: "both fire"
- id: hooks-015
  title: "a hook's returned subject replaces the subject; returning nothing leaves it unchanged"
  spec: spec/06-hooks-and-contracts.md
  given: "two before-update hooks, the first returns a changed item, the second returns nothing"
  when: "update an entity"
  then: "stored item has the first hook's change"
- id: hooks-016
  title: "a later hook overwriting an earlier hook's field logs a warning naming both plugins"
  spec: spec/06-hooks-and-contracts.md
  given: "two plugins set the same field in one chain"
  when: "invoke the hook"
  then: "last value stands; warning names both"
- id: hooks-017
  title: "before hooks time out at 5 seconds; a manifest timeout raises the limit up to 30 seconds"
  spec: spec/06-hooks-and-contracts.md
  given: "a before hook that never resolves"
  when: "invoke the hook"
  then: "stopped at 5 s; operation continues"
- id: hooks-018
  title: "a detached after hook runs after the response is sent and does not delay it"
  spec: spec/06-hooks-and-contracts.md
  given: "git.after.commit declared detached with a 2 second job"
  when: "save a page"
  then: "response returned before the job finishes; the job completes within its 60 second limit"
- id: render-001
  title: "render.before can short-circuit with a cached document; render.after stores it"
  spec: spec/06-hooks-and-contracts.md
  given: "a caching plugin"
  when: "request the same page twice"
  then: "second request is served from the cache without running render.before.content"
- id: render-002
  title: "a cached document is invalidated by a page save"
  spec: spec/06-hooks-and-contracts.md
  given: "cached page"
  when: "save the page"
  then: "next request re-renders"
- id: render-003
  title: "render.before.content can transform the assembled content before it enters the shell"
  spec: spec/06-hooks-and-contracts.md
  given: "an SSR plugin"
  when: "render a page with a custom element"
  then: "output contains the element's rendered markup"
- id: render-004
  title: "an injected singleton carries values from the plugin's settings and never a secret"
  spec: spec/08-capabilities-privacy.md
  given: "google-analytics with a tracking id and an API secret"
  when: "render a page"
  then: "tracking id is in the output; the secret is not"
- id: exec-001
  title: "a plugin that spawns a process without exec:run is rejected"
  spec: spec/08-capabilities-privacy.md
  given: "backend code calling spawn without the capability"
  when: "validate or load"
  then: "rejected"
- id: hook-090
  title: "config hooks without a filter only see the plugin's own config"
  spec: spec/06-hooks-and-contracts.md
  given: "A subscribes config.after.save with no config list; B's setting changes"
  when: "config set B key value"
  then: "A's hook does not run; with config: [B] or [\"*\"] it does"
- id: hook-091
  title: "user hooks get the limited record without users:full"
  spec: spec/06-hooks-and-contracts.md
  given: "plugin subscribed to user.after.login without users:full"
  when: "a user logs in"
  then: "subject has id, name, displayName, roles, avatar only; never email, password hash or tokens"
- id: hook-092
  title: "detached is refused where the caller waits"
  spec: spec/06-hooks-and-contracts.md
  given: "subscription to rest.after.request with detached: true"
  when: "load"
  then: "subscription refused with a reason; other hooks load"
- id: hook-093
  title: "every operation fires its before and after pair"
  spec: spec/06-hooks-and-contracts.md
  given: "the comprehensive example enabled"
  when: "each operation in schema/hook-contracts.json runs once"
  then: "the before hook logs before the operation and the after hook after it, with subject and previous as listed"
- id: hook-094
  title: "an alias fires once and under the subscribed name"
  spec: spec/06-hooks-and-contracts.md
  given: "plugin subscribed to page.before.save"
  when: "a page is updated"
  then: "the hook runs once, named page.before.save, with the page content loaded"
- id: hook-095
  title: "theme.before.change only fires when the theme changes"
  spec: spec/06-hooks-and-contracts.md
  given: "plugin subscribed to theme.before.change"
  when: "site settings saved twice: once changing the title, once changing metadata.theme"
  then: "the hook runs only for the second save, with the old theme in ctx.previous"
- id: hook-096
  title: "other plugins can subscribe to a plugin-defined hook"
  spec: spec/06-hooks-and-contracts.md
  given: "plugin B depends on example and subscribes to example.after.explode"
  when: "example fires the explosion"
  then: "B's hook runs with { fileId, size, at }"
