- id: example-001
  title: "a boring item is vetoed"
  hook: entity.before.create
  given: "item with name boring.awesome"
  when: "create"
  then: "operation fails with 'Too boring'"
- id: example-002
  title: "missing greeting keeps the plugin inactive"
  hook: plugin.before.requirements
  given: "settings.greeting empty"
  when: "enable"
  then: "status enabled/inactive with requirement settings.greeting"
- id: example-003
  title: "public ping answers without auth"
  operation: examplePing
  given: "no token"
  when: "GET /v1/plugins/example/public/ping"
  then: "200"
- id: example-004
  title: "a bulk outline edit reindexes once"
  hook: page.after.save
  given: "bulk transaction saving 20 pages"
  when: "transaction ends"
  then: "page.after.save marks example.reindex and returns; transaction.after.end logs one reindex"
- id: example-005
  title: "the counter singleton carries the greeting from settings"
  hook: render.after.body
  given: "settings.greeting is Hello"
  when: "a page renders"
  then: "body ends with <awesome-counter greeting=\"Hello\"> and no secret values appear in the HTML"
- id: example-006
  title: "explode fires the plugin's own hooks"
  operation: exampleExplode
  given: "a subscriber vetoes example.before.explode"
  when: "POST /v1/plugins/example/explosions"
  then: "409 with the veto message; example.after.explode does not fire"
