openapi: 3.1.0
info:
  title: Example plugin
  version: 0.1.0
# Paths are relative; the platform mounts them at /v1/plugins/example/
paths:
  /explosions:
    get:
      operationId: exampleListExplosions
      summary: List explosions (authenticated)
      # offered as an MCP tool when the optional MCP plugin is enabled; the caller's own permissions still apply
      x-hax-mcp: true
      security:
        - bearerAuth: []
          userTokenHeader: []
      responses:
        "200": { description: OK }
  /public/ping:
    get:
      operationId: examplePing
      summary: Public ping
      x-hax-public: true
      x-hax-rate-limit: { requests: 30, per: minute }
      responses:
        "200": { description: OK }
