prompts:
  - id: summarize-whats-new
    title: Summarize what's new in my HAXcms
    kind: howto
    skill: announcements-whats-new
    prompt: |
      My HAXcms is version {{haxcms.version}}. Using `hax whats-new --json` if available (or GET /system/api/v1/plugins/announcements/latest
      with my JWT and X-HAXCMS-User-Token), summarize what is new for a site author, grouped by type, with one line each.
  - id: diagnose-announcements
    title: The What's New button shows nothing or fails
    kind: diagnose
    skill: announcements-curate
    prompt: |
      The announcements plugin {{plugin.version}} on HAXcms {{haxcms.version}} ({{runtime}}) has status {{status}}.
      Recent log entries:
      {{log}}
      Check data/announcements.json and data/types.json for entries pointing at unknown types, drafts marked ready by
      mistake, or versions newer than the running version, and tell me what to fix.
