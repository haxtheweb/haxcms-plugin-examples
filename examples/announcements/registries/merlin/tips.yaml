# Merlin: "HAX tips". Same shape as whats-new.yaml, filtered to tips.
option:
  title: HAX tips
  icon: icons:lightbulb-outline
  tags: [tips, announcements, help]
  path: HAX/action/tips
  context: [CMS]
  voice: tip of the day
  eventName: super-daemon-run-program
  value:
    name: HAX tips
    machineName: announcements-tips
    placeholder: Filter tips
program:
  kind: api
  operation: announcementsListTips
  query: { "page.limit": 20 }
  items: items
  row:
    title: "{{label}}"
    description: "{{description}}"
    path: "HAX/action/tips/{{slug}}"
    eventName: announcements-open
    value: { uuid: "{{uuid}}" }
