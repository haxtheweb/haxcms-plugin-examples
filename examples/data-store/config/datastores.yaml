# Illustrative: the datastore declaration format is not formalized yet (see spec gap list).
stores:
  - id: votes            # popular content by votes; travels with the site
    scope: site          # <site>/_config/data/data-store/votes.json
    file: votes.json
  - id: notes            # per-site, per-user records; stays on the server, keyed by site UUID
    scope: siteData      # <HAXCMS_ROOT>/_config/siteData/<siteUuid>/data-store/notes.json
    file: notes.json
    personalData: true   # supports export and erase by user id
  - id: feed-cache       # an aggregate across sites (for example an RSS feed of 10 sites)
    scope: system        # <HAXCMS_ROOT>/_config/systemData/data-store/feed-cache.json
    file: feed-cache.json
  - id: badge            # travels inside site.json
    scope: manifest      # metadata.plugins.data-store
